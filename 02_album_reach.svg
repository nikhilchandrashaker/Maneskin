<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Source Serif 4 Static">
  <rect x="0" y="0" width="640" height="380" fill="#1d1116"/>
  <text x="30" y="34" fill="#cdd9e6" font-family="Big Shoulders Display Bold" font-size="20">How far each album travelled</text>
  <text x="30" y="54" fill="#7f8fa1" font-size="12.5">Album chart peak position by market (lower on the chart = better position)</text>

  <g transform="translate(0,30)">
    <g stroke="#3a222b" stroke-width="1" stroke-dasharray="2 4">
      <line x1="90" y1="30"  x2="612" y2="30"/>
      <line x1="90" y1="120" x2="612" y2="120"/>
      <line x1="90" y1="210" x2="612" y2="210"/>
    </g>
    <g fill="#7f8fa1" font-size="11" text-anchor="end">
      <text x="82" y="34">#1</text>
      <text x="82" y="124">#25</text>
      <text x="82" y="214">#50</text>
    </g>
    <text x="8" y="234" fill="#7f8fa1" font-style="italic" font-size="10.5">didn't chart →</text>

    <g>
      <line x1="140" y1="30" x2="140" y2="228" stroke="#3a222b" stroke-width="1"/>
      <circle cx="120" cy="30"  r="6" fill="#d1183f"/>
      <circle cx="140" cy="228" r="5" fill="none" stroke="#7f8fa1" stroke-width="1.5" stroke-dasharray="1.5 2"/>
      <circle cx="160" cy="228" r="5" fill="none" stroke="#7f8fa1" stroke-width="1.5" stroke-dasharray="1.5 2"/>
    </g>

    <g>
      <line x1="340" y1="30" x2="340" y2="228" stroke="#3a222b" stroke-width="1"/>
      <circle cx="320" cy="30"  r="6" fill="#d1183f"/>
      <circle cx="340" cy="192" r="6" fill="#cc9a3f"/>
      <circle cx="360" cy="228" r="5" fill="none" stroke="#7f8fa1" stroke-width="1.5" stroke-dasharray="1.5 2"/>
    </g>

    <g>
      <line x1="540" y1="30" x2="540" y2="228" stroke="#3a222b" stroke-width="1"/>
      <circle cx="520" cy="30" r="6" fill="#d1183f"/>
      <circle cx="540" cy="43" r="6" fill="#cc9a3f"/>
      <circle cx="560" cy="87" r="6" fill="#cdd9e6"/>
    </g>

    <g fill="#cdd9e6" font-family="Big Shoulders Display SemiBold" font-size="14" text-anchor="middle">
      <text x="140" y="260">Il ballo della vita</text>
      <text x="340" y="260">Teatro d'ira: Vol. I</text>
      <text x="540" y="260">Rush!</text>
    </g>
    <g fill="#7f8fa1" font-size="11" text-anchor="middle">
      <text x="140" y="276">2018</text>
      <text x="340" y="276">2021</text>
      <text x="540" y="276">2023</text>
    </g>
  </g>

  <g transform="translate(30,346)" font-size="12" fill="#7f8fa1">
    <circle cx="6" cy="-4" r="5" fill="#d1183f"/><text x="16" y="0">Italy</text>
    <circle cx="76" cy="-4" r="5" fill="#cc9a3f"/><text x="86" y="0">UK</text>
    <circle cx="136" cy="-4" r="5" fill="#cdd9e6"/><text x="146" y="0">US</text>
    <circle cx="196" cy="-4" r="5" fill="none" stroke="#7f8fa1" stroke-width="1.5" stroke-dasharray="1.5 2"/><text x="206" y="0">Didn't chart there</text>
  </g>
  <text x="30" y="370" fill="#7f8fa1" font-style="italic" font-size="11">Source: Wikipedia — Måneskin discography (FIMI, Official Charts Company, Billboard)</text>
</svg>
